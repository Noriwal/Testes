name: ${COMPOSE_PROJECT_NAME:-automation}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-n8n: &n8n-common
  image: n8nio/n8n:${N8N_VERSION}
  restart: unless-stopped
  env_file: .env
  environment:
    TZ: ${TZ}
    GENERIC_TIMEZONE: ${TZ}
    DB_TYPE: postgresdb
    DB_POSTGRESDB_HOST: postgres
    DB_POSTGRESDB_PORT: 5432
    DB_POSTGRESDB_DATABASE: ${N8N_DB}
    DB_POSTGRESDB_USER: ${N8N_DB_USER}
    DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
    N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
    N8N_HOST: ${N8N_DOMAIN}
    N8N_PROTOCOL: http
    N8N_PORT: 8080
    N8N_EDITOR_BASE_URL: https://${N8N_DOMAIN}/
    WEBHOOK_URL: https://${N8N_DOMAIN}/
    N8N_PROXY_HOPS: 1
    N8N_SECURE_COOKIE: "true"
    EXECUTIONS_MODE: ${N8N_EXECUTIONS_MODE:-regular}
    QUEUE_BULL_REDIS_HOST: redis
    QUEUE_BULL_REDIS_PORT: 6379
    QUEUE_BULL_REDIS_DB: 1
    EXECUTIONS_DATA_PRUNE: "true"
    EXECUTIONS_DATA_MAX_AGE: 336
  networks: [backend, egress, proxy]
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  logging: *default-logging

services:
  postgres:
    image: postgres:${POSTGRES_VERSION}
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: postgres
      EVOLUTION_DB: ${EVOLUTION_DB}
      EVOLUTION_DB_USER: ${EVOLUTION_DB_USER}
      EVOLUTION_DB_PASSWORD: ${EVOLUTION_DB_PASSWORD}
      N8N_DB: ${N8N_DB}
      N8N_DB_USER: ${N8N_DB_USER}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    cpus: ${POSTGRES_CPUS:-1.0}
    mem_limit: ${POSTGRES_MEMORY:-1024M}
    logging: *default-logging

  redis:
    image: redis:${REDIS_VERSION}
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    cpus: ${REDIS_CPUS:-0.5}
    mem_limit: ${REDIS_MEMORY:-512M}
    logging: *default-logging

  evolution:
    image: evoapicloud/evolution-api:${EVOLUTION_VERSION}
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: ${TZ}
      SERVER_TYPE: http
      SERVER_PORT: 8080
      SERVER_URL: ${EVOLUTION_PUBLIC_URL:-http://evolution.localhost}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${EVOLUTION_DB_USER}:${EVOLUTION_DB_PASSWORD}@postgres:5432/${EVOLUTION_DB}?schema=public
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/2
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_LOCAL_ENABLED: "false"
      AUTHENTICATION_TYPE: apikey
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "false"
    expose:
      - "8080"
    networks: [backend, egress, proxy]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    cpus: ${EVOLUTION_CPUS:-1.0}
    mem_limit: ${EVOLUTION_MEMORY:-1024M}
    logging: *default-logging

  n8n:
    <<: *n8n-common
    expose:
      - "8080"
    volumes:
      - n8n_data:/home/node/.n8n
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    cpus: ${N8N_CPUS:-1.5}
    mem_limit: ${N8N_MEMORY:-1536M}

  n8n-worker:
    <<: *n8n-common
    profiles: [worker]
    command: ["worker", "--concurrency=${N8N_WORKER_CONCURRENCY:-5}"]
    volumes:
      - n8n_worker_data:/home/node/.n8n
    cpus: ${N8N_WORKER_CPUS:-1.0}
    mem_limit: ${N8N_WORKER_MEMORY:-1024M}

  duckdns:
    image: lscr.io/linuxserver/duckdns:latest
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      SUBDOMAINS: ${DUCKDNS_SUBDOMAIN}
      TOKEN: ${DUCKDNS_TOKEN}
      LOG_FILE: "false"
    networks: [egress]
    logging: *default-logging

  nginx:
    image: nginx:1.27.3-alpine
    profiles: [https]
    restart: unless-stopped
    environment:
      EVOLUTION_DOMAIN: ${EVOLUTION_DOMAIN}
      N8N_DOMAIN: ${N8N_DOMAIN}
      NGINX_ENVSUBST_FILTER: "EVOLUTION_DOMAIN|N8N_DOMAIN"
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    networks: [proxy]
    depends_on:
      evolution:
        condition: service_healthy
      n8n:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/nginx-health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    logging: *default-logging

  certbot:
    image: certbot/certbot:v3.1.0
    profiles: [ssl-tools]
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    networks: [egress]

networks:
  backend:
    internal: true
  egress:
  proxy:

volumes:
  postgres_data:
  redis_data:
  n8n_data:
  n8n_worker_data:
  certbot_www:
  certbot_certs:
