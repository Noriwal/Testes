name: ${COMPOSE_PROJECT_NAME:-automation}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-n8n: &n8n-common
  image: n8nio/n8n:${N8N_VERSION}
  restart: unless-stopped
  env_file: .env
  environment:
    TZ: ${TZ}
    GENERIC_TIMEZONE: ${TZ}
    DB_TYPE: postgresdb
    DB_POSTGRESDB_HOST: postgres
    DB_POSTGRESDB_PORT: 5432
    DB_POSTGRESDB_DATABASE: ${N8N_DB}
    DB_POSTGRESDB_USER: ${N8N_DB_USER}
    DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
    N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
    N8N_HOST: ${N8N_DOMAIN}
    N8N_PROTOCOL: https
    N8N_PORT: 5678
    N8N_EDITOR_BASE_URL: https://${N8N_DOMAIN}/
    WEBHOOK_URL: https://${N8N_DOMAIN}/
    N8N_PROXY_HOPS: 1
    EXECUTIONS_MODE: ${N8N_EXECUTIONS_MODE:-regular}
    QUEUE_BULL_REDIS_HOST: redis
    QUEUE_BULL_REDIS_PORT: 6379
    QUEUE_BULL_REDIS_DB: 1
    EXECUTIONS_DATA_PRUNE: "true"
    EXECUTIONS_DATA_MAX_AGE: 336
  networks: [backend, egress]
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  logging: *default-logging

services:
  postgres:
    image: postgres:${POSTGRES_VERSION}
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: postgres
      EVOLUTION_DB: ${EVOLUTION_DB}
      EVOLUTION_DB_USER: ${EVOLUTION_DB_USER}
      EVOLUTION_DB_PASSWORD: ${EVOLUTION_DB_PASSWORD}
      N8N_DB: ${N8N_DB}
      N8N_DB_USER: ${N8N_DB_USER}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    cpus: ${POSTGRES_CPUS:-1.0}
    mem_limit: ${POSTGRES_MEMORY:-1024M}
    logging: *default-logging

  redis:
    image: redis:${REDIS_VERSION}
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    cpus: ${REDIS_CPUS:-0.5}
    mem_limit: ${REDIS_MEMORY:-512M}
    logging: *default-logging

  evolution:
    image: evoapicloud/evolution-api:${EVOLUTION_VERSION}
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: ${TZ}
      SERVER_TYPE: http
      SERVER_PORT: 8080
      SERVER_URL: https://${EVOLUTION_DOMAIN}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${EVOLUTION_DB_USER}:${EVOLUTION_DB_PASSWORD}@postgres:5432/${EVOLUTION_DB}?schema=public
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/2
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_LOCAL_ENABLED: "false"
      AUTHENTICATION_TYPE: apikey
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "false"
    ports:
      - "127.0.0.1:8080:8080"
    networks: [backend, egress]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    cpus: ${EVOLUTION_CPUS:-1.0}
    mem_limit: ${EVOLUTION_MEMORY:-1024M}
    logging: *default-logging

  n8n:
    <<: *n8n-common
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    cpus: ${N8N_CPUS:-1.5}
    mem_limit: ${N8N_MEMORY:-1536M}

  n8n-worker:
    <<: *n8n-common
    profiles: [worker]
    command: ["worker", "--concurrency=${N8N_WORKER_CONCURRENCY:-5}"]
    volumes:
      - n8n_worker_data:/home/node/.n8n
    cpus: ${N8N_WORKER_CPUS:-1.0}
    mem_limit: ${N8N_WORKER_MEMORY:-1024M}

networks:
  backend:
    internal: true
  egress:
    # Evolution e n8n precisam de saída para APIs, webhooks e serviços externos.
    # PostgreSQL e Redis não participam desta rede.

volumes:
  postgres_data:
  redis_data:
  n8n_data:
  n8n_worker_data:
